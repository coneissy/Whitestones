[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whitestones"
version = "0.2.0"
description = "WhiteStones Telegram bot application"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
lint = ["ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
